[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artflow-agent"
version = "0.1.0"
description = "Agent-orchestrated ComfyUI pipeline for reproducible game art iteration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[openai]>=1,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
artflow = "artflow_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/artflow_agent"]

[tool.hatch.build.targets.wheel.force-include]
"recipes" = "artflow_agent/recipes"
"web/dist" = "artflow_agent/web"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
